# The whole deployment policy, as one declarative object.
#
# This replaces the promote/ramp/cleanup scripting entirely. CI
# changes exactly one thing in here -- the image tag -- and the controller does
# the rest: derives a Build ID, creates a versioned Deployment for it, waits for
# it to poll, ramps traffic through the steps below, promotes it to Current,
# and eventually sunsets the old version.
#
# Rendered by scripts/deploy.sh with envsubst (only ${IMAGE} varies).
apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: greeting-worker
  namespace: temporal-demo
spec:
  replicas: 2

  workerOptions:
    connectionRef:
      name: temporal-dev
    temporalNamespace: default

  rollout:
    # Progressive: shift new workflow executions onto the new version in steps,
    # pausing at each. Alternatives are AllAtOnce and Manual.
    strategy: Progressive
    steps:
      - rampPercentage: 10
        pauseDuration: 30s
      - rampPercentage: 50
        pauseDuration: 30s

  sunset:
    # Both delays are measured from the moment a version reports `drained`,
    # i.e. once no open workflow is pinned to it any more.
    scaledownDelay: 0s
    deleteDelay: 60s

  # A normal pod template. The controller adds TEMPORAL_ADDRESS,
  # TEMPORAL_NAMESPACE, TEMPORAL_DEPLOYMENT_NAME and TEMPORAL_WORKER_BUILD_ID
  # to every container, so the worker does not configure its own identity.
  template:
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: ${IMAGE}
          # Images are built straight into minikube's Docker daemon, so there
          # is no registry to pull from.
          imagePullPolicy: IfNotPresent
          # The controller treats a version as healthy only once its pods are
          # ready, and this probe passes only after the worker is polling.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: TEMPORAL_TASK_QUEUE
              value: greeting-tq
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
