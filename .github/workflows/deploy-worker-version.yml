name: Deploy Worker Version

# Every push that touches worker code ships a new Worker Deployment Version.
#
# Note how little this pipeline does: it builds an image and points the
# WorkerDeployment resource at it. The Temporal Worker Controller handles the
# rollout itself -- gate workflow, traffic ramping, promotion and sunsetting.
# The rollout *policy* lives in k8s/workerdeployment.template.yaml, not here,
# so changing how you deploy is a reviewable change to a manifest.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "k8s/**"
      - "scripts/deploy.sh"
      - ".github/workflows/deploy-worker-version.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build and deploy (default: short Git SHA). Set this to a previously built tag to roll back."
        required: false
        default: ""

concurrency:
  # Two rollouts of the same WorkerDeployment at once would fight over the
  # target version.
  group: worker-version-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # minikube runs on the machine hosting the runner, so this must be a
    # self-hosted runner. See README "Running this for real".
    runs-on: self-hosted

    env:
      K8S_NAMESPACE: temporal-demo
      WORKER_DEPLOYMENT: greeting-worker
      # Long enough to cover every ramp step's pauseDuration plus startup.
      ROLLOUT_TIMEOUT_SECONDS: "900"

    steps:
      - uses: actions/checkout@v4

      - name: Check cluster and controller are ready
        run: |
          minikube status
          # Fail early and legibly rather than midway through a rollout.
          kubectl get crd workerdeployments.temporal.io >/dev/null
          kubectl rollout status -n temporal-system \
            deployment/temporal-worker-controller-manager --timeout=120s
          kubectl rollout status -n "$K8S_NAMESPACE" deployment/temporal --timeout=120s

      - name: Build image and update WorkerDeployment
        run: scripts/deploy.sh ${{ github.event.inputs.image_tag }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Worker rollout"
            echo
            echo '```'
            kubectl get workerdeployment "$WORKER_DEPLOYMENT" -n "$K8S_NAMESPACE" 2>&1 || true
            echo '```'
            echo
            echo "### Conditions"
            echo '```'
            kubectl get workerdeployment "$WORKER_DEPLOYMENT" -n "$K8S_NAMESPACE" \
              -o jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason}: {.message}{"\n"}{end}' 2>&1 || true
            echo '```'
            echo
            echo "Versions still running (the controller deletes each one once it drains):"
            echo '```'
            kubectl get deployments -n "$K8S_NAMESPACE" \
              -l "temporal.io/deployment-name=$WORKER_DEPLOYMENT" \
              -L temporal.io/build-id 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
